services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: electrakart-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production and must be >= 32 chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://electrakart.in,https://admin.electrakart.in}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-2097152}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      AUTO_SEED: "false"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - electrakart-prod-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.electrakart.in/api/v1}
        VITE_ALLOW_DEMO_FALLBACK: "false"
    container_name: electrakart-frontend-prod
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"
    networks:
      - electrakart-prod-network

networks:
  electrakart-prod-network:
    driver: bridge
